<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniMax H3 管理后台</title>
  <link rel="stylesheet" href="/manager/assets/styles.css">
  <script defer src="/manager/assets/manager.js"></script>
</head>
<body>
  <header class="topbar">
    <strong class="brand">MiniMax H3 管理后台</strong>
    <div class="session-info"><span id="freshness" class="freshness loading">正在加载</span><span>管理员</span><button id="open-node-config" type="button">节点配置</button><button id="logout" class="link-button" type="button">退出</button></div>
  </header>
  <main class="console">
    <p class="section-label">全部任务</p>
    <section id="tasks-section" class="panel" aria-labelledby="tasks-title">
      <div class="section-head">
        <div class="heading-line"><h1 id="tasks-title">任务列表</h1><span id="task-total" class="muted">共 -- 条</span></div>
        <div class="filters">
          <label><span>状态</span><select id="status-filter"><option value="">全部</option><option value="queued">排队</option><option value="running">运行中</option><option value="succeeded">成功</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></label>
          <label><span>实例</span><select id="upstream-filter"><option value="">全部</option></select></label>
          <label class="search-control"><span>搜索</span><input id="search-filter" type="search" placeholder="任务 ID / 客户" autocomplete="off"></label>
        </div>
      </div>
      <div class="table-scroll">
        <div class="task-table" role="table" aria-label="全部任务">
          <div class="task-row task-head" role="row"><span>任务 ID</span><span>客户</span><span>状态</span><span>实例</span><span>方式</span><span>规格</span><span>耗时</span><span>创建时间</span><span>操作</span></div>
          <div id="task-rows" class="task-rows"><p class="table-state">正在加载任务...</p></div>
        </div>
      </div>
      <div class="pager">
        <label>每页 <select id="page-size"><option value="10">10</option><option value="20">20</option></select></label>
        <div><button id="previous-page" type="button">上一页</button><span id="page-summary">第 1 / 1 页</span><button id="next-page" type="button">下一页</button></div>
      </div>
    </section>

    <section class="private-shell" aria-labelledby="private-title">
      <div class="private-head">
        <div><h2 id="private-title">私有服务监控</h2><span class="muted">独立节点运行状态与任务</span></div>
        <div id="health-summary" class="health-summary"><span class="muted">节点状态加载中</span></div>
      </div>
      <div class="private-grid">
        <aside class="nodes">
          <p class="aside-label">选择私有实例</p>
          <div id="node-list" class="node-list" aria-live="polite"><p class="inline-state">正在加载节点...</p></div>
        </aside>
        <article id="node-detail" class="detail" aria-live="polite">
          <div class="detail-placeholder">正在加载节点详情...</div>
        </article>
      </div>
    </section>
  </main>
  <dialog id="node-config-dialog" class="config-dialog">
    <div class="dialog-shell">
      <header class="dialog-head">
        <h2>模型服务节点</h2>
        <button id="close-node-config" class="icon-button" type="button" title="关闭" aria-label="关闭">×</button>
      </header>
      <div class="config-layout">
        <aside class="config-node-sidebar">
          <div class="config-list-head"><strong>节点</strong><button id="new-node" type="button">新增</button></div>
          <div id="config-node-list" class="config-node-list" aria-live="polite"><p class="inline-state">正在加载节点...</p></div>
        </aside>
        <form id="node-config-form" class="node-config-form" novalidate>
          <input name="version" type="hidden">
          <label><span>节点 ID</span><input name="id" maxlength="64" autocomplete="off" required></label>
          <label><span>模型服务地址</span><input name="base_url" type="url" placeholder="http://host:8200" autocomplete="off" required></label>
          <label><span>任务服务地址</span><input name="jobs_base_url" type="url" placeholder="http://host:8188" autocomplete="off" required></label>
          <label><span>视频公开地址</span><input name="public_base_url" type="url" placeholder="https://video.example.com" autocomplete="off" required></label>
          <div class="form-grid">
            <label><span>健康检查路径</span><input name="health_path" value="/" required></label>
            <label><span>轮询间隔</span><input name="poll_interval" value="3s" required></label>
            <label><span>提交 API 名称</span><input name="submit_api_name" value="submit_minimax_from_slots" required></label>
            <label><span>请求超时</span><input name="request_timeout" value="30s" required></label>
          </div>
          <label><span>结果查询 API 名称</span><input name="check_api_name" value="check_and_get_video" required></label>
          <label class="toggle-control"><input name="enabled" type="checkbox" checked><span>启用节点</span></label>
          <p id="node-form-status" class="form-status" aria-live="polite"></p>
          <footer class="form-actions">
            <button id="delete-node" class="danger-button" type="button" hidden>删除</button>
            <span class="action-spacer"></span>
            <button id="test-node" type="button">测试连接</button>
            <button id="save-node" class="primary-button" type="submit">保存</button>
          </footer>
        </form>
      </div>
    </div>
  </dialog>
</body>
</html>
