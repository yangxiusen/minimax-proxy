<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - MiniMax H3 管理后台</title>
  <link rel="stylesheet" href="/manager/assets/styles.css">
  <script defer src="/manager/assets/login.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <form id="login-form" class="login-panel">
      <p class="eyebrow">管理控制台</p>
      <h1>MiniMax H3 管理后台</h1>
      <label>账号<input id="username" name="username" autocomplete="username" required></label>
      <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
      <button id="login-submit" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
