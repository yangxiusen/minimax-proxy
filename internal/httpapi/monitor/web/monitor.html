<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniMax H3 运行监控</title>
  <link rel="stylesheet" href="/monitor/assets/styles.css">
  <script defer src="/monitor/assets/monitor.js"></script>
</head>
<body>
  <header class="topbar">
    <strong class="brand">MiniMax H3 运行监控</strong>
    <div class="session-info"><span id="freshness" class="freshness loading">正在加载</span><span>管理员</span><button id="logout" class="link-button" type="button">退出</button></div>
  </header>
  <main class="console">
    <p class="section-label">全部任务</p>
    <section id="tasks-section" class="panel" aria-labelledby="tasks-title">
      <div class="section-head">
        <div class="heading-line"><h1 id="tasks-title">任务列表</h1><span id="task-total" class="muted">共 -- 条</span></div>
        <div class="filters">
          <label><span>状态</span><select id="status-filter"><option value="">全部</option><option value="queued">排队</option><option value="running">运行中</option><option value="succeeded">成功</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></label>
          <label><span>实例</span><select id="upstream-filter"><option value="">全部</option></select></label>
          <label class="search-control"><span>搜索</span><input id="search-filter" type="search" placeholder="任务 ID / 客户" autocomplete="off"></label>
        </div>
      </div>
      <div class="table-scroll">
        <div class="task-table" role="table" aria-label="全部任务">
          <div class="task-row task-head" role="row"><span>任务 ID</span><span>客户</span><span>状态</span><span>实例</span><span>方式</span><span>规格</span><span>耗时</span><span>创建时间</span></div>
          <div id="task-rows" class="task-rows"><p class="table-state">正在加载任务...</p></div>
        </div>
      </div>
      <div class="pager">
        <label>每页 <select id="page-size"><option value="10">10</option><option value="20">20</option></select></label>
        <div><button id="previous-page" type="button">上一页</button><span id="page-summary">第 1 / 1 页</span><button id="next-page" type="button">下一页</button></div>
      </div>
    </section>

    <section class="private-shell" aria-labelledby="private-title">
      <div class="private-head">
        <div><h2 id="private-title">私有服务监控</h2><span class="muted">独立节点运行状态与任务</span></div>
        <div id="health-summary" class="health-summary"><span class="muted">节点状态加载中</span></div>
      </div>
      <div class="private-grid">
        <aside class="nodes">
          <p class="aside-label">选择私有实例</p>
          <div id="node-list" class="node-list" aria-live="polite"><p class="inline-state">正在加载节点...</p></div>
        </aside>
        <article id="node-detail" class="detail" aria-live="polite">
          <div class="detail-placeholder">正在加载节点详情...</div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
