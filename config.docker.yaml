server:
  address: ":18080"
  read_timeout: 15s
  write_timeout: 15s

admin:
  username: admin
  password: "${MINIMAX_ADMIN_PASSWORD}"
  session_ttl: 12h
  monitor_interval: 5s
  secure_cookie: false

database:
  path: /data/minimax.db

queue:
  protected_slots: 3
  per_key_unfinished_limit: 10
  global_unfinished_limit: 100

task:
  retention: 168h
  idempotency_ttl: 24h
  execution_timeout: 10m

# 对外 API Key 在 /manager 的“密钥管理”中创建和维护。
# 升级时，旧版 api_keys 会在首次启动后一次性导入 SQLite。

# 模型服务节点在 /manager 的“节点配置”中维护，并存储于 SQLite。
# 升级时若数据库尚无节点，旧版 upstreams 会在首次启动时自动导入一次。

generation_profiles:
  480P:
    model_mode: high_quality
    custom_model: __follow_model_mode__
    custom_model_high: __follow_model_mode__
    easy_cache: true
    steps: 20
    dimensions:
      adaptive: {width: 832, height: 480}
      "21:9": {width: 1120, height: 480}
      "16:9": {width: 832, height: 480}
      "4:3": {width: 640, height: 480}
      "1:1": {width: 480, height: 480}
      "3:4": {width: 480, height: 640}
      "9:16": {width: 480, height: 832}
